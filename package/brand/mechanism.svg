<svg xmlns='http://www.w3.org/2000/svg' width='1180' height='360' viewBox='0 0 1180 360' role='img' aria-label='mirrorcut mechanism: run each config and its mirror on the same task; half the difference cancels task difficulty, baseline and all pairwise interactions; each switch keeps its own e-process and any stopping time is valid'><rect width='1180' height='360' fill='#faf7f2' rx='12'/><line x1='372' y1='24' x2='372' y2='336' stroke='#ded7cb' stroke-width='1.4'/><line x1='762' y1='24' x2='762' y2='336' stroke='#ded7cb' stroke-width='1.4'/><text x='180' y='40' font-family="Georgia, 'Times New Roman', serif" font-size='17' fill='#141414' text-anchor='middle' font-weight='700' >1. same task, twice</text><text x='125' y='78' font-family="Georgia, 'Times New Roman', serif" font-size='13' fill='#c9553d' text-anchor='middle' font-weight='700' >config x</text><text x='235' y='78' font-family="Georgia, 'Times New Roman', serif" font-size='13' fill='#2f6f7a' text-anchor='middle' font-weight='700' >mirror -x</text><text x='40' y='108' font-family="Georgia, 'Times New Roman', serif" font-size='14' fill='#141414' text-anchor='start' font-weight='400' >retry</text><rect x='99' y='92' width='52' height='22' rx='11' fill='#c9553d' opacity='1'/><text x='125' y='108' font-family="Georgia, 'Times New Roman', serif" font-size='12' fill='#faf7f2' text-anchor='middle' font-weight='700' >ON</text><rect x='209' y='92' width='52' height='22' rx='11' fill='#2f6f7a' opacity='0.25'/><text x='235' y='108' font-family="Georgia, 'Times New Roman', serif" font-size='12' fill='#141414' text-anchor='middle' font-weight='700' >OFF</text><text x='40' y='142' font-family="Georgia, 'Times New Roman', serif" font-size='14' fill='#141414' text-anchor='start' font-weight='400' >reflect</text><rect x='99' y='126' width='52' height='22' rx='11' fill='#c9553d' opacity='0.25'/><text x='125' y='142' font-family="Georgia, 'Times New Roman', serif" font-size='12' fill='#141414' text-anchor='middle' font-weight='700' >OFF</text><rect x='209' y='126' width='52' height='22' rx='11' fill='#2f6f7a' opacity='1'/><text x='235' y='142' font-family="Georgia, 'Times New Roman', serif" font-size='12' fill='#faf7f2' text-anchor='middle' font-weight='700' >ON</text><text x='40' y='176' font-family="Georgia, 'Times New Roman', serif" font-size='14' fill='#141414' text-anchor='start' font-weight='400' >guardrail</text><rect x='99' y='160' width='52' height='22' rx='11' fill='#c9553d' opacity='1'/><text x='125' y='176' font-family="Georgia, 'Times New Roman', serif" font-size='12' fill='#faf7f2' text-anchor='middle' font-weight='700' >ON</text><rect x='209' y='160' width='52' height='22' rx='11' fill='#2f6f7a' opacity='0.25'/><text x='235' y='176' font-family="Georgia, 'Times New Roman', serif" font-size='12' fill='#141414' text-anchor='middle' font-weight='700' >OFF</text><text x='180' y='240' font-family="Georgia, 'Times New Roman', serif" font-size='13' fill='#8a8478' text-anchor='middle' font-weight='400' >every undecided switch flipped,</text><text x='180' y='258' font-family="Georgia, 'Times New Roman', serif" font-size='13' fill='#8a8478' text-anchor='middle' font-weight='400' >same task, two runs</text><text x='180' y='300' font-family="Georgia, 'Times New Roman', serif" font-size='16' fill='#141414' text-anchor='middle' font-weight='700' >d = ( y(x) - y(-x) ) / 2</text><text x='562' y='40' font-family="Georgia, 'Times New Roman', serif" font-size='17' fill='#141414' text-anchor='middle' font-weight='700' >2. half the difference cancels</text><text x='562' y='95' font-family="Georgia, 'Times New Roman', serif" font-size='15' fill='#8a8478' text-anchor='middle' font-weight='400' >task difficulty</text><line x1='500' y1='90' x2='624' y2='90' stroke='#c9553d' stroke-width='2.4'/><text x='562' y='141' font-family="Georgia, 'Times New Roman', serif" font-size='15' fill='#8a8478' text-anchor='middle' font-weight='400' >intercept / baseline</text><line x1='480' y1='136' x2='644' y2='136' stroke='#c9553d' stroke-width='2.4'/><text x='562' y='187' font-family="Georgia, 'Times New Roman', serif" font-size='15' fill='#8a8478' text-anchor='middle' font-weight='400' >every 2-switch interaction</text><line x1='455' y1='182' x2='669' y2='182' stroke='#c9553d' stroke-width='2.4'/><text x='562' y='233' font-family="Georgia, 'Times New Roman', serif" font-size='15' fill='#141414' text-anchor='middle' font-weight='700' >each switch's own effect</text><text x='562' y='300' font-family="Georgia, 'Times New Roman', serif" font-size='13' fill='#8a8478' text-anchor='middle' font-weight='400' >what survives is the signal</text><text x='962' y='40' font-family="Georgia, 'Times New Roman', serif" font-size='17' fill='#141414' text-anchor='middle' font-weight='700' >3. one e-process per switch</text><line x1='808' y1='90' x2='1122' y2='90' stroke='#141414' stroke-dasharray='6,4' stroke-width='1.4'/><text x='812' y='82' font-family="Georgia, 'Times New Roman', serif" font-size='12' fill='#8a8478' text-anchor='start' font-weight='400' >admit at k/&#945;</text><path d='M 810 268 L 840 254 L 870 260 L 900 228 L 930 208 L 960 213 L 990 173 L 1020 148 L 1050 118 L 1072 90' fill='none' stroke='#c9553d' stroke-width='2.6'/><path d='M 810 268 L 850 274 L 890 258 L 930 264 L 970 248 L 1010 256 L 1050 242 L 1110 250' fill='none' stroke='#2f6f7a' stroke-width='2.6'/><path d='M 810 268 L 860 276 L 910 272 L 960 280 L 1010 274 L 1060 282 L 1110 278' fill='none' stroke='#8a8478' stroke-width='2.6'/><text x='1042' y='78' font-family="Georgia, 'Times New Roman', serif" font-size='13' fill='#c9553d' text-anchor='start' font-weight='700' >admitted</text><text x='1114' y='270' font-family="Georgia, 'Times New Roman', serif" font-size='12' fill='#8a8478' text-anchor='end' font-weight='400' >undecided</text><line x1='902' y1='300' x2='902' y2='282' stroke='#2f6f7a' stroke-width='1.2'/><path d='M 902 282 l -4 7 l 8 0 z' fill='#2f6f7a'/><line x1='982' y1='300' x2='982' y2='282' stroke='#2f6f7a' stroke-width='1.2'/><path d='M 982 282 l -4 7 l 8 0 z' fill='#2f6f7a'/><line x1='1062' y1='300' x2='1062' y2='282' stroke='#2f6f7a' stroke-width='1.2'/><path d='M 1062 282 l -4 7 l 8 0 z' fill='#2f6f7a'/><text x='962' y='322' font-family="Georgia, 'Times New Roman', serif" font-size='14' fill='#2f6f7a' text-anchor='middle' font-weight='700' font-style='italic'>stop here. or here. or here. all valid.</text></svg>